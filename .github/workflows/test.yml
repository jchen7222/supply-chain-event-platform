name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q          # includes fixture ingest, dbt build,
                                          # and the point-in-time == vintage-archive assertion
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional: activates the live ALFRED test
