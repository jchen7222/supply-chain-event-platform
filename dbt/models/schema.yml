version: 2
models:
  - name: stg_events
    description: "Typed passthrough of the append-only envelope (EPCIS-modeled)."
    columns:
      - name: seq
        tests: [unique, not_null]
      - name: entity_id
        tests: [not_null]
      - name: record_time
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: [alfred, openfda, imf_imts, gscpi, pharma_synthetic, usitc_hts,
                       dispatch_planner, order_intake, courier_tracking]
  - name: current_state
    columns:
      - name: entity_id
        tests: [unique, not_null]
  - name: history
    columns:
      - name: entity_id
        tests: [not_null]
  - name: duty_rate_current
    description: "Duty schedule in force now — one row per HS code, effective-dated."
    columns:
      - name: hts_code
        tests: [unique, not_null]
      - name: rate_kind
        tests:
          - not_null
          - accepted_values:
              values: [ad_valorem, free, specific, compound, unparsed]
  - name: order_to_delivery
    description: >
      The spine: one row per customer order, from the quote to the last courier
      scan. Joins order intake, the tariff archive and the courier log — and
      computes true_profit_cad, which the pricing tool cannot, because it does
      not know about duty.
    columns:
      - name: order_ref
        tests: [unique, not_null]
      - name: order_state
        tests:
          - not_null
          - accepted_values:
              values: [delivered, in_flight, needs_attention, returned,
                       no_scans_yet, quoted_not_shipped, rejected]
      - name: quantity
        tests: [not_null]
  - name: parcels_without_orders
    description: >
      Parcels the courier is scanning that no order accounts for. Reconciliation
      in the uncomfortable direction. Empty is the expected state; a row is a
      work list, not a build failure.
    columns:
      - name: waybill
        tests: [unique, not_null]
  - name: landed_duty_by_order
    description: >
      Each routing decision from the dispatch planner, priced at the duty rate
      in force on that order's own ship date. The join is per row, not per
      build — a September shipment and a June shipment get different rates.
      Neither repository can produce this table alone.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: pricing_status
        tests:
          - not_null
          - accepted_values:
              values: [priceable, no_heading, no_rate_on_ship_date, not_ad_valorem]
      - name: rule_set_version
        tests: [not_null]
      - name: matched_rule
        tests: [not_null]
  - name: duty_rate_as_of
    description: "The duty schedule as it stood on `as_of` — what a filer would have used that day."
    columns:
      - name: hts_code
        tests: [unique, not_null]
seeds:
  - name: registry
    description: "The source registry — one row per source; the dbt seed mirror of ingest/registry.py."
